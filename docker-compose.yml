version: "3.9"

services:

  # ── Infrastructure ──────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env
    # postgres:15 reads POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD from env
    # Add these three lines to your .env:
    #   POSTGRES_DB=ftrace
    #   POSTGRES_USER=ftrace
    #   POSTGRES_PASSWORD=ftrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ftrace -d ftrace"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Backend ─────────────────────────────────────────────────────

  fastapi:
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Dockerfile
    command: python consumer.py
    env_file: .env
    depends_on:
      fastapi:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  producer:
    build:
      context: .
      dockerfile: Dockerfile
    command: python producer.py
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Frontend ────────────────────────────────────────────────────

  frontend:
    build:
      context: ./anomaly-dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - fastapi
    restart: unless-stopped

volumes:
  pgdata:
